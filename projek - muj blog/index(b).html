<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vojenský blog | Vstupní stránka</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Pozadí - tmavá fotka */
        .hero {
            position: relative;
            height: 100vh;
            width: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="%232c3e50"><rect width="1600" height="900" fill="%231a2632"/><circle cx="400" cy="200" r="80" fill="%23344e5c" opacity="0.3"/><circle cx="1200" cy="700" r="120" fill="%23344e5c" opacity="0.3"/><path d="M0 600 L400 500 L800 650 L1200 450 L1600 550 L1600 900 L0 900 Z" fill="%23344e5c" opacity="0.2"/><rect x="200" y="300" width="80" height="120" fill="%23344e5c" opacity="0.25"/><rect x="1300" y="550" width="100" height="150" fill="%23344e5c" opacity="0.25"/></svg>');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Tmavý overlay pro efekt */
        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0.5) 100%);
            z-index: 1;
        }

        /* Obsah uprostřed */
        .content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 2;
            width: 90%;
            max-width: 800px;
        }

        /* Název blogu */
        .content h1 {
            font-size: 4rem;
            color: white;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 1rem;
            font-weight: 700;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
            border-right: 3px solid #c0392b;
            border-left: 3px solid #c0392b;
            display: inline-block;
            padding: 0 2rem;
        }

        .content p {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.8);
            margin: 1.5rem 0 2rem 0;
            letter-spacing: 1px;
        }

        /* Tlačítko / odkaz - BEZ ANIMACE */
        .enter-btn {
            display: inline-block;
            background-color: #c0392b;
            color: white;
            text-decoration: none;
            padding: 1rem 3rem;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 2px solid #c0392b;
        }

        /* Volitelné - malý text dole */
        .footer-note {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
            z-index: 2;
        }

        /* Responzivní */
        @media (max-width: 768px) {
            .content h1 {
                font-size: 2.5rem;
                padding: 0 1rem;
            }

            .content p {
                font-size: 1rem;
            }

            .enter-btn {
                padding: 0.8rem 2rem;
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            .content h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>

<body>
    <div class="hero">
        <div class="content">
            <h1>VOJENSKÝ BLOG</h1>
            <p>Aktuální dění, historie a analýzy z vojenského světa</p>
            <a href="index1.html" class="enter-btn">Vstoupit do blogu</a>

            <div>
                <div>

</body>

</html>
