<!DOCTYPE html>
<html lang="cs">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #b9b9b9;
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 40px 20px;
      background-color: #000000;
      color: #fff;
    }

    header h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    header p {
      font-size: 1.2rem;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      max-width: 900px;
    }

    .btn {
      background-color: #fff;
      color: #54daff;
      text-decoration: none;
      padding: 20px 30px;
      border: 2px solid #5ad7f9;
      border-radius: 8px;
      font-size: 1.1rem;
      transition: background-color 0.3s, color 0.3s;
      flex: 1 1 200px;
      text-align: center;
    }

    .btn:hover {
      background-color: #41d6ff;
      color: #fff;
    }

    footer {
      text-align: center;
      padding: 15px 20px;
      background-color: #ddd;
      font-size: 0.9rem;
    }

        #menu-toggle {
            display: none;
        }

        .hamburger {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1001;
            width: 50px;
            height: 50px;
            background: #333;
            color: white;
            font-size: 28px;
            cursor: pointer;
            border-radius: 5px;
            text-align: center;
            line-height: 50px;
        }

        .menu {
            position: fixed;
            top: 0;
            left: -250px;
            width: 250px;
            height: 100%;
            background: #333;
            padding-top: 80px;
            transition: left 0.3s ease;
            z-index: 1000;
        }

        #menu-toggle:checked ~ .menu {
            left: 0;
        }

        .menu a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 18px 25px;
            font-size: 18px;
        }

        .menu a:hover {
            background: #555;
        }
  </style>
</head>

<body>
  <header>
    <h1>SAVULA DENYS</h1>
    <p>SPŠE a VOŠ Pardubice - MOJE PROJEKTY</p>
  </header>

    <input type="checkbox" id="menu-toggle">

    <label for="menu-toggle" class="hamburger">☰</label>

    <nav class="menu">
        <a href="">Domů</a>
        <a href="Hlavni stranka (about me).html">O mě</a>
    </nav>



  <main>
    <section class="buttons">
      <a class="btn" href="Moje zvire.html">Projekt „Zvířátko“</a>
      <a class="btn" href="projek - muj blog/">Můj blog</a>
      <a class="btn" href="WA muj projekt/">Můj projekt</a>
      <a class="btn" href="OnePageLayout/">OnePageLayout</a>
      <a class="btn" href="zaverecny.projekt/">Závěrečný projekt</a>
    </section>
  </main>
</body>

</html>
